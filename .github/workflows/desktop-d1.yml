name: Desktop D1 protocol PoC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-d1.yml"
      - "cmd/desktop-poc-sidecar/**"
      - "desktop/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  protocol-poc:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Select pinned Rust toolchain
        run: rustup default 1.97.1
      - name: Install locked Tauri CLI
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Test Go protocol sidecar
        run: go test ./cmd/desktop-poc-sidecar
      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Test Tauri shell
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build unbundled desktop PoC
        working-directory: desktop
        env:
          CYBERSTRIKE_DESKTOP_TARGET: ${{ matrix.target }}
        run: npm run poc:build
      - name: Run lifecycle smoke
        working-directory: desktop
        env:
          CYBERSTRIKE_DESKTOP_TARGET: ${{ matrix.target }}
        run: npm run poc:smoke
      - name: Run single-instance smoke
        working-directory: desktop
        env:
          CYBERSTRIKE_DESKTOP_TARGET: ${{ matrix.target }}
        run: npm run poc:smoke:single-instance
      - name: Run lifecycle failure smokes
        working-directory: desktop
        env:
          CYBERSTRIKE_DESKTOP_TARGET: ${{ matrix.target }}
        run: npm run poc:smoke:failures
