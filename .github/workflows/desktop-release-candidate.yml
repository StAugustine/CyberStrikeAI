name: Desktop portable release candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-release-candidate.yml"
      - "cmd/desktop-core/**"
      - "desktop/**"
      - "internal/app/**"
      - "internal/desktopcredentials/**"
      - "internal/desktopmigration/**"
      - "internal/desktopprotocol/**"
      - "internal/desktopruntime/**"
      - "web/**"
      - "agents/**"
      - "roles/**"
      - "skills/**"
      - "tools/**"
      - "knowledge_base/**"
      - "config.example.yaml"
      - "go.mod"
      - "go.sum"
      - "LICENSE"

permissions:
  contents: read

jobs:
  portable-archive:
    name: ${{ matrix.name }} portable ZIP
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin

    env:
      CYBERSTRIKE_DESKTOP_TARGET: ${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tmp/cyberstrike-tauri-target
      CYBERSTRIKE_RELEASE_BUILD_ROOT: ${{ github.workspace }}/.tmp/cyberstrike-tauri-target/${{ matrix.target }}/release
      CYBERSTRIKE_PORTABLE_STAGE: ${{ github.workspace }}/.tmp/cyberstrike-portable-stage/${{ matrix.target }}
      CYBERSTRIKE_PORTABLE_EXTRACT: ${{ github.workspace }}/.tmp/cyberstrike-portable-extract/${{ matrix.target }}
      CYBERSTRIKE_PORTABLE_RUNTIME: ${{ github.workspace }}/.tmp/cyberstrike-portable-runtime/${{ matrix.target }}
      CYBERSTRIKE_RELEASE_OUTPUT: ${{ github.workspace }}/.tmp/cyberstrike-release/${{ matrix.target }}
      CYBERSTRIKE_RELEASE_SBOM: ${{ github.workspace }}/.tmp/cyberstrike-release/${{ matrix.target }}/sbom.cdx.json

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Select pinned Rust toolchain
        run: rustup default 1.97.1
      - name: Install Rust release target
        run: rustup target add ${{ matrix.target }}
      - name: Install locked Tauri CLI
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Verify committed resource manifest
        working-directory: desktop
        shell: bash
        run: |
          npm run resources:manifest
          git diff --exit-code -- resources/manifest.json
      - name: Test release tooling
        working-directory: desktop
        run: npm run release:test
      - name: Verify excluded desktop web assets
        run: go test ./web
      - name: Build unsigned portable application
        working-directory: desktop
        run: npm run desktop:bundle:candidate
      - name: Create portable ZIP
        working-directory: desktop
        run: npm run desktop:package:portable
      - name: Audit portable package contents
        working-directory: desktop
        run: npm run release:audit
      - name: Generate deterministic CycloneDX SBOM
        working-directory: desktop
        run: npm run release:sbom
      - name: Verify extracted portable runtime and data retention
        working-directory: desktop
        run: npm run release:runtime
      - name: Generate release manifest and SHA-256 checksums
        working-directory: desktop
        run: npm run release:checksums
      - name: Upload unsigned portable release candidate
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}-portable-unsigned
          path: ${{ env.CYBERSTRIKE_RELEASE_OUTPUT }}
          if-no-files-found: error
          retention-days: 7
